{% extends "base.html" %}
{% block title %}{{ _("Anmelden") }}{% endblock %}
{% block main %}
<div class="card" style="max-width:420px;margin:30px auto">
<h1>{{ _("Anmelden") }}</h1>
{% if error %}<p class="hint" role="alert">{{ _("Anmeldung fehlgeschlagen.") }}</p>{% endif %}
<form method="post" action="/login" style="display:grid;gap:10px">
  <input type="hidden" name="next" value="{{ next }}">
  <label>{{ _("E-Mail") }}<br><input name="email" type="email" autocomplete="username" required style="width:100%"></label>
  <label>{{ _("Passwort") }}<br><input name="password" type="password" autocomplete="current-password" required style="width:100%"></label>
  <label>{{ _("Code aus der Authenticator-App") }} <span class="small">({{ _("nur Administratoren") }})</span><br>
    <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*" style="width:100%"></label>
  <button type="submit">{{ _("Anmelden") }}</button>
</form>
<p class="small">{{ _("Konten vergibt der Administrator Ihrer Organisation.") }}</p>
</div>
{% endblock %}
